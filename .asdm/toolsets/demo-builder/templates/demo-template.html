<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ASDM Demo - {{title}}</title>
    <link rel="stylesheet" href="demo-styles.css">
</head>
<body>
    <div id="app">
        <!-- Header -->
        <header class="demo-header">
            <div class="header-content">
                <h1 class="demo-title">{{title}}</h1>
                <div class="header-controls">
                    <button id="play-btn" class="play-btn" title="进入全屏演示模式">
                        <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor">
                            <path d="M8 5v14l11-7z"/>
                        </svg>
                    </button>
                    <div class="page-indicator">
                        <span id="current-page">1</span>
                        <span>/</span>
                        <span id="total-pages">{{totalPages}}</span>
                    </div>
                </div>
            </div>
        </header>

        <!-- Navigation -->
        <nav class="demo-nav">
            <button id="prev-btn" class="nav-btn prev-btn" title="上一页 (左箭头)">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor">
                    <path d="M15.41 7.41L14 6l-6 6 6 6 1.41-1.41L10.83 12z"/>
                </svg>
            </button>
            <button id="next-btn" class="nav-btn next-btn" title="下一页 (右箭头)">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor">
                    <path d="M10 6L8.59 7.41 13.17 12l-4.58 4.59L10 18l6-6z"/>
                </svg>
            </button>
        </nav>

        <!-- Main Content -->
        <main class="demo-content">
            <div class="slides-container">
                <!-- PAGES_PLACEHOLDER -->
            </div>
        </main>

        <!-- Progress Bar -->
        <div class="progress-container">
            <div class="progress-bar">
                <div id="progress-fill" class="progress-fill"></div>
            </div>
        </div>
    </div>

    <!-- Full Screen Overlay -->
    <div id="fullscreen-overlay" class="fullscreen-overlay">
        <div class="fullscreen-content">
            <div class="slides-container">
                <!-- FULLSCREEN_PAGES_PLACEHOLDER -->
            </div>
        </div>
        <button id="exit-fullscreen" class="exit-fullscreen-btn" title="退出全屏 (ESC)">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor">
                <path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/>
            </svg>
        </button>
    </div>

    <script src="demo-script.js"></script>
</body>
</html>
