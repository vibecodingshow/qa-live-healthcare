<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>演示</title>
    <link rel="stylesheet" href="../assets/style.css">
</head>
<body>
    <div class="presentation" id="presentation"></div>
    
    <nav class="controls">
        <button class="control-btn" id="prevBtn" title="上一页 (←)">◀</button>
        <button class="control-btn" id="playBtn" title="全屏播放 (F)">▶</button>
        <button class="control-btn" id="nextBtn" title="下一页 (→)">▶</button>
    </nav>

    <div class="progress-bar">
        <div class="progress-fill" id="progressFill"></div>
    </div>

    <div class="page-indicator">
        <span id="currentPage">1</span> / <span id="totalPages">1</span>
    </div>

    <div class="slide-counter" id="slideCounter"></div>

    <script src="../assets/script.js"></script>
</body>
</html>
