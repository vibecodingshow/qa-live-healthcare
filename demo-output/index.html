<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ASDM Demo Builder 演示站点</title>
    <link rel="stylesheet" href="assets/css/styles.css">
</head>
<body>
    <div class="container">
        <header class="header">
            <h1>ASDM Demo Builder 演示站点</h1>
            <p class="subtitle">基于 demo-installation-guide.md 构建</p>
        </header>

        <main class="main-content">
            <div class="play-controls">
                <button id="playBtn" class="play-button" aria-label="开始演示">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor">
                        <path d="M8 5v14l11-7z"/>
                    </svg>
                    开始演示
                </button>
                <div class="keyboard-hint">
                    提示：使用 <kbd>←</kbd> <kbd>→</kbd> 键切换页面，<kbd>ESC</kbd> 退出全屏
                </div>
            </div>

            <div class="pages-overview">
                <h2>演示页面概览</h2>
                <div class="pages-grid" id="pagesGrid">
                    <!-- 页面缩略图将通过 JavaScript 动态生成 -->
                </div>
            </div>

            <div class="progress-indicator">
                <div class="progress-bar">
                    <div class="progress-fill" id="progressFill"></div>
                </div>
                <div class="progress-text">
                    <span id="currentPage">1</span> / <span id="totalPages">10</span>
                </div>
            </div>
        </main>

        <footer class="footer">
            <p>基于 ASDM Demo Builder 工具集构建</p>
        </footer>
    </div>

    <!-- 演示模式模态框 -->
    <div id="presentationModal" class="presentation-modal hidden">
        <div class="presentation-container">
            <div class="presentation-header">
                <button id="exitPresentation" class="exit-button" aria-label="退出演示">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
                        <path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/>
                    </svg>
                </button>
                <div class="presentation-title" id="presentationTitle"></div>
                <div class="presentation-progress">
                    <span id="presentationCurrent">1</span> / <span id="presentationTotal">10</span>
                </div>
            </div>
            
            <div class="presentation-content" id="presentationContent">
                <!-- 页面内容将通过 JavaScript 动态加载 -->
            </div>
            
            <div class="presentation-navigation">
                <button id="prevPage" class="nav-button" aria-label="上一页">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
                        <path d="M15.41 7.41L14 6l-6 6 6 6 1.41-1.41L10.83 12z"/>
                    </svg>
                </button>
                <button id="nextPage" class="nav-button" aria-label="下一页">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
                        <path d="M10 6L8.59 7.41 13.17 12l-4.58 4.59L10 18l6-6z"/>
                    </svg>
                </button>
            </div>
        </div>
    </div>

    <script src="assets/js/navigation.js"></script>
    <script src="assets/js/main.js"></script>
</body>
</html>
